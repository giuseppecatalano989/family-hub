name: Verifiche Casa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: casa-ci-only
          POSTGRES_DB: casa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:cloud
        env:
          CASA_TEST_DATABASE_URL: postgresql://postgres:casa-ci-only@127.0.0.1:5432/casa_test
      - run: npm run build
      - run: npm run test:browser:install -- --with-deps
      - run: npm run test:e2e
